# Harness config. ${VAR} and ${VAR:-default} expand from the environment,
# so keys stay out of this file.

cache_dir = ".harness/cache"

# ---- providers: OpenAI-compatible base URLs, key optional -----------------

[providers.ollama]
base_url = "http://127.0.0.1:11434/v1"
default = true                      # bare model ids land here

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"      # reads $OPENAI_API_KEY; omit for keyless gateways
timeout = 120
strict = true                       # only models listed by /v1/models

[providers.gateway]
base_url = "${LLM_GATEWAY_URL:-http://127.0.0.1:8080/v1}"
api_key = "${LLM_GATEWAY_KEY}"      # empty env -> no Authorization header
headers = { "x-trace" = "harness" }
extra = { temperature = 0.2 }       # merged into every request body

# ---- aliases: named fallback chains, resolved left to right --------------

[aliases]
fast = "ollama/llama3.2:3b"
smart = ["openai/gpt-4o", "gateway/claude-sonnet-4-5", "ollama/qwen2.5-coder:7b"]
cheap = ["ollama/llama3.2:3b", "ollama/qwen2.5:7b"]
workhorse = "smart"                 # aliases may point at aliases

# ---- jobs: model + prompt + output contract per pipeline stage -----------

[jobs.triage]
model = "fast"
system = "Label the input. Reply with JSON only."
template = "Text: {input}"
format = "schema"
temperature = 0
schema = {
  type = "object",
  required = ["category", "severity"],
  properties = {
    category = { type = "string", enum = ["bug", "feature", "question", "other"] },
    severity = { type = "string", enum = ["low", "med", "high"] },
  },
}

[jobs.summarize]
model = "workhorse"
system = "Summarize in at most 3 bullets, plain text."
max_tokens = 400
temperature = 0.2

[jobs.extract]
model = "smart"
format = "json"
system = "Extract fields as a JSON object."

[jobs.draft]
model = "smart"
template = "Write a reply to: {input}"
max_tokens = 800

# ---- pipelines: stages chained per item, each stage picks its own model ---

[pipelines.triage-then-summarize]
stages = [
  { job = "triage" },                        # stage 1 sees the raw item
  { job = "summarize", input = "json" },     # stage 2 sees stage 1's JSON
]

[pipelines.extract-then-draft]
fail_fast = true                             # stop the item after a bad stage
stages = [
  { job = "extract" },
  { job = "draft", input = "field:body", keep = true },  # prefer item.body
]
